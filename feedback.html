<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ER LAB — ご意見・ご要望</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Antique&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .feedback-hero {
      padding: var(--s-20) var(--s-8) var(--s-12);
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    .feedback-hero .eyebrow {
      font-family: var(--font-display);
      font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--accent); margin-bottom: var(--s-4);
    }
    .feedback-hero h1 {
      font-family: var(--font-headline-jp);
      font-size: clamp(28px, 4vw, 48px);
      color: var(--text); margin-bottom: var(--s-4);
    }
    .feedback-hero p {
      font-size: 14px; color: var(--text-secondary);
      line-height: 1.9; max-width: 560px; margin: 0 auto;
    }

    .feedback-main {
      max-width: 800px; margin: 0 auto;
      padding: var(--s-16) var(--s-8);
    }

    .info-cards {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: var(--s-4); margin-bottom: var(--s-12);
    }
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px; padding: var(--s-6);
      text-align: center;
    }
    .info-card-label {
      font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--accent); margin-bottom: var(--s-2);
    }
    .info-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

    .form-section-label {
      font-family: var(--font-display);
      font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--text-muted);
      display: flex; align-items: center; gap: var(--s-4);
      margin-bottom: var(--s-8);
    }
    .form-section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .form-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .form-wrap iframe {
      width: 100%; border: none; display: block;
      min-height: 680px;
    }
    .form-placeholder {
      padding: var(--s-16); text-align: center;
    }
    .form-placeholder .step {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px; padding: var(--s-8);
      margin-bottom: var(--s-4); text-align: left;
    }
    .form-placeholder .step-num {
      font-family: var(--font-display);
      font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--accent); margin-bottom: var(--s-2);
    }
    .form-placeholder .step p {
      font-size: 13px; color: var(--text-secondary); line-height: 1.8;
    }
    .form-placeholder .step code {
      font-family: var(--font-mono);
      font-size: 12px; color: var(--accent);
      background: var(--bg-raised); padding: 2px 8px; border-radius: 4px;
    }

    @media (max-width: 600px) {
      .info-cards { grid-template-columns: 1fr; }
      .feedback-main { padding: var(--s-10) var(--s-4); }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">ER<span>LAB</span></a>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="characters.html">キャラ対策</a></li>
      <li><a href="rank-guide.html">ランク上げ</a></li>
      <li><a href="changelog.html">更新履歴</a></li>
      <li><a href="feedback.html" class="active">ご意見・ご要望</a></li>
    </ul>
  </div>
</nav>

<div class="feedback-hero">
  <p class="eyebrow">Feedback</p>
  <h1>ご意見・ご要望</h1>
  <p>サイトの改善点・掲載してほしい情報・バグ報告など、<br>お気軽にお送りください。参考にしながらサイトを改善していきます。</p>
</div>

<div class="feedback-main">

  <div class="info-cards">
    <div class="info-card">
      <div class="info-card-label">対応内容</div>
      <p>情報の追加・修正・バグ報告・デザイン改善などなんでもOK</p>
    </div>
    <div class="info-card">
      <div class="info-card-label">返信について</div>
      <p>個別返信はしていませんが、内容はすべて確認しています</p>
    </div>
    <div class="info-card">
      <div class="info-card-label">反映タイミング</div>
      <p>優先度の高いものから順次対応。無料で実装できるものを優先</p>
    </div>
  </div>

  <div class="form-section-label">フォーム</div>

  <div class="form-wrap" id="form-wrap">
    <iframe src="https://docs.google.com/forms/d/1ZfMDHKwO-DX-kTAKcDrp1wlgcbhpn2RqNPpSj-bIOUY/viewform?embedded=true"
      width="100%" height="700" frameborder="0" marginheight="0" marginwidth="0"
      style="display:block;">読み込んでいます…</iframe>
  </div>

</div>

<footer style="border-top:1px solid var(--border-subtle);padding:32px;text-align:center;">
  <p style="font-size:12px;color:var(--text-muted);">© 2026 ER LAB — Personal Strategy Site</p>
</footer>

</body>
</html>
